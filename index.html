<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#251b29" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>霓虹轨道 · 万圣奇妙夜 | Halloween Express</title>
    <script type="module" crossorigin src="./assets/main-BB2BAZsp.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/Config-BccD8gUY.js">
    <link rel="stylesheet" crossorigin href="./assets/main-REsH2q4I.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <!-- HUD -->
      <div id="hud" class="screen hidden">
        <div class="hud-top">
          <div class="hud-left">
            <div class="hud-score" id="hud-score">0</div>
            <div class="hud-sub" id="hud-distance">0 m</div>
            <div class="hud-clock" id="hud-clock">06:00</div>
          </div>
          <div class="hud-right">
            <div class="hud-coins"><span class="coin-dot"></span><span id="hud-coins">0</span></div>
            <button id="btn-pause" class="icon-btn" aria-label="暂停">❚❚</button>
          </div>
        </div>
        <div id="hud-feedback" class="hud-feedback hidden" role="status" aria-live="polite"></div>
        <div id="hud-goal" class="hud-goal"></div>
        <div id="hud-trip" class="trip-hud" hidden>
          <div class="trip-hud-heading"><b id="trip-stage"></b><span id="trip-clock"></span></div>
          <div class="trip-progress"><i id="trip-progress"></i></div>
          <p id="trip-cargo"></p><p id="trip-next"></p>
        </div>
        <div id="hud-story" class="hud-story hidden" role="status" aria-live="polite"><b id="hud-story-title"></b><span id="hud-story-text"></span></div>
        <div class="hud-powerups" id="hud-powerups"></div>
        <div class="hud-hints" id="hud-hints">← → 变道 · ↑ 跳跃 · ↓ 翻滚 · Esc 暂停</div>
      </div>

      <!-- Main menu -->
      <div id="menu" class="screen">
        <div class="panel menu-panel">
          <div class="title-wrap">
            <h1 class="game-title">霓虹轨道</h1>
            <div class="game-subtitle">万圣奇妙夜 · HALLOWEEN EXPRESS</div>
            <div class="bear-tag">南瓜夜市开张 · 不给糖就跑步</div>
          </div>
          <div class="menu-stats">
            <div class="stat-chip">最高分 <b id="menu-best">0</b></div>
            <div class="stat-chip">金币 <b id="menu-coins">0</b></div>
          </div>
          <div class="menu-buttons">
            <button id="btn-start" class="btn btn-primary" aria-haspopup="dialog" aria-controls="mode-picker" aria-expanded="false">开始游戏</button>
            <button id="btn-shop" class="btn">商店</button>
            <button id="btn-missions" class="btn">任务列表</button>
            <button id="btn-collection" class="btn">收藏册</button>
            <button id="btn-settings" class="btn">设置</button>
          </div>
          <div class="menu-skin" id="menu-skin-name">当前造型:经典 Joke Bear</div>
          <div class="menu-clock" id="menu-clock"></div>
          <div class="menu-goal" id="menu-goal"></div>
        </div>
        <dialog id="mode-picker" class="panel mode-dialog" aria-labelledby="mode-picker-title">
          <div class="panel-head">
            <h2 id="mode-picker-title">选择游戏模式</h2>
            <button id="btn-mode-close" class="icon-btn" aria-label="关闭模式选择">✕</button>
          </div>
          <div class="mode-options">
            <button id="btn-mode-endless" class="mode-choice" autofocus>
              <span class="mode-icon" aria-hidden="true">
                <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 10 10 46M34 10l12 36M19 18h18M16 28h24M13 39h30"/><path d="m27 9-3 16h8l-5 13" stroke="#ffda93"/></svg>
              </span>
              <span class="mode-copy"><b>无尽冲刺</b><small>自由跑酷 · 挑战最高分</small></span>
              <span class="mode-arrow" aria-hidden="true">›</span>
            </button>
            <button id="btn-trip" class="mode-choice">
              <span class="mode-icon mode-icon-trip" aria-hidden="true">
                <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="40" r="7"/><circle cx="43" cy="40" r="7"/><path d="M13 33h17l5-16h7M34 22l9 18M21 27h9M13 33v-5h8l5 12h10"/><path d="M8 19h13v10H8z" fill="currentColor" stroke="none"/></svg>
              </span>
              <span class="mode-copy"><b>三站旅行</b><small>90秒 · 骑车送单与寄存</small></span>
              <span class="mode-arrow" aria-hidden="true">›</span>
            </button>
          </div>
        </dialog>
      </div>

      <!-- Shop -->
      <div id="shop" class="screen hidden">
        <div class="panel shop-panel">
          <div class="panel-head">
            <h2>商店</h2>
            <div class="stat-chip">金币 <b id="shop-coins">0</b></div>
            <button class="icon-btn" id="btn-shop-close" aria-label="关闭">✕</button>
          </div>
          <div class="shop-tabs" role="tablist" aria-label="商店分类">
            <button class="shop-tab active" id="shop-tab-characters" role="tab" aria-selected="true" aria-controls="shop-characters">角色商店</button>
            <button class="shop-tab" id="shop-tab-outfits" role="tab" aria-selected="false" aria-controls="shop-outfits">造型商店</button>
            <button class="shop-tab" id="shop-tab-items" role="tab" aria-selected="false" aria-controls="shop-items">道具商店</button>
          </div>
          <section class="shop-section" id="shop-characters" role="tabpanel" aria-labelledby="shop-tab-characters">
            <div class="skin-grid" id="character-grid"></div>
          </section>
          <section class="shop-section" id="shop-outfits" role="tabpanel" aria-labelledby="shop-tab-outfits" hidden>
            <div class="skin-grid" id="outfit-grid"></div>
          </section>
          <section class="shop-section" id="shop-items" role="tabpanel" aria-labelledby="shop-tab-items" hidden>
            <p class="shop-section-desc">升级道具持续时间，购买后永久生效。</p>
            <div class="upgrade-grid" id="upgrade-grid"></div>
          </section>
        </div>
      </div>

      <!-- Full 3D preview of any skin before purchase -->
      <div id="tryon" class="screen hidden">
        <div class="tryon-controls">
          <div class="tryon-navigation">
            <button id="btn-tryon-prev" class="icon-btn" aria-label="上一个">‹</button>
            <span id="tryon-name" aria-live="polite"></span>
            <button id="btn-tryon-next" class="icon-btn" aria-label="下一个">›</button>
          </div>
          <div class="tryon-purchase">
            <div class="tryon-actions">
              <button id="btn-tryon-back" class="btn">返回商店</button>
              <button id="btn-tryon-buy" class="btn btn-primary">立即购买</button>
            </div>
            <span id="tryon-notice" class="tryon-notice hidden" aria-live="polite"></span>
          </div>
        </div>
      </div>

      <!-- Missions -->
      <div id="missions" class="screen hidden">
        <div class="panel shop-panel">
          <div class="panel-head">
            <h2>任务列表</h2>
            <button class="icon-btn" id="btn-missions-close" aria-label="关闭">✕</button>
          </div>
          <p id="mission-short-goal" class="short-goal-ticket"></p>
          <div class="mission-list" id="mission-list"></div>
        </div>
      </div>

      <!-- Pause -->
      <div id="collection" class="screen hidden">
        <div class="panel shop-panel collection-panel">
          <div class="panel-head"><h2>站台纪念册</h2><button class="icon-btn" id="btn-collection-close" aria-label="关闭收藏册">✕</button></div>
          <p class="collection-intro">每一趟都有点故事。解锁动作，带回站台展示。</p>
          <div id="collection-grid" class="collection-grid"></div>
        </div>
      </div>

      <!-- Pause -->
      <div id="pause" class="screen hidden">
        <div class="panel">
          <h2>暂停中</h2>
          <div class="menu-buttons">
            <button id="btn-resume" class="btn btn-primary">继续游戏</button>
            <button id="btn-restart" class="btn">重新开始</button>
            <button id="btn-pause-settings" class="btn">设置</button>
            <button id="btn-quit" class="btn">返回主菜单</button>
          </div>
        </div>
      </div>

      <!-- Game over -->
      <div id="gameover" class="screen hidden">
        <div class="panel">
          <h2 id="go-title">游戏结束</h2>
          <p id="go-caption" class="go-caption"></p>
          <div id="go-adventure" class="go-adventure"></div>
          <div id="go-trip" class="trip-postcards" hidden></div>
          <div class="go-record hidden" id="go-record">新纪录!</div>
          <div class="go-stats">
            <div class="go-row"><span>最终分数</span><b id="go-score">0</b></div>
            <div class="go-row"><span>本局距离</span><b id="go-distance">0 m</b></div>
            <div class="go-row"><span>本局金币</span><b id="go-coins">0</b></div>
            <div class="go-row"><span>历史最高</span><b id="go-best">0</b></div>
          </div>
          <div class="menu-buttons">
            <button id="btn-again" class="btn btn-primary">再玩一次</button>
            <button id="btn-home" class="btn">返回主菜单</button>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div id="settings" class="screen hidden">
        <div class="panel">
          <div class="panel-head">
            <h2>设置</h2>
            <button class="icon-btn" id="btn-settings-close" aria-label="关闭">✕</button>
          </div>
          <div class="setting-row"><label for="set-music">背景音乐</label><input type="range" id="set-music" min="0" max="1" step="0.05" /></div>
          <div class="setting-row"><label for="set-sfx">游戏音效</label><input type="range" id="set-sfx" min="0" max="1" step="0.05" /></div>
          <div class="setting-row"><label for="set-quality">画质等级</label>
            <select id="set-quality">
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div class="setting-row"><label for="set-shadows">阴影</label><input type="checkbox" id="set-shadows" /></div>
          <div class="setting-row"><label for="set-shake">镜头震动</label><input type="checkbox" id="set-shake" /></div>
          <div class="setting-row"><label for="set-hints">操作提示</label><input type="checkbox" id="set-hints" /></div>
        </div>
      </div>

      <div id="toasts"></div>
      <div id="bear-rotate-hint" class="bear-rotate-hint hidden">← 左右拖动或滑动旋转 →</div>
      <div id="debug" class="hidden"></div>
    </div>
  </body>
</html>
